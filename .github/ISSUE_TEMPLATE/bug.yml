name: Bug Report / Сообщение об ошибке
description: File a bug report / Сообщить об ошибке в FlowZapret
title: "[Bug] "
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке! / Thanks for reporting a bug!

        Не забудьте указать, о какой вкладке речь: **Обход DPI** или **Telegram**.
        Please mention which tab is affected: **DPI bypass** or **Telegram**.
  - type: dropdown
    id: area
    attributes:
      label: Affected area / Что затронуто
      options:
        - DPI bypass (VPN/Proxy) / Обход DPI (VPN/Proxy)
        - Telegram MTProto proxy / Telegram MTProto прокси
        - Component updater / Обновление компонентов
        - UI / Settings
        - Other / Другое
    validations:
      required: true
  - type: textarea
    id: bug
    attributes:
      label: Describe the bug / Описание ошибки
      description: A clear and concise description of what the bug is / Четкое и краткое описание ошибки
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce / Как воспроизвести
      description: Steps to reproduce the behavior / Шаги для воспроизведения проблемы
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Ожидаемое поведение
      description: A clear and concise description of what you expected to happen / Четкое и краткое описание ожидаемого поведения
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Скриншоты
      description: If applicable, add screenshots to help explain your problem / При необходимости добавьте скриншоты
  - type: textarea
    id: environment
    attributes:
      label: Environment / Окружение
      description: Please complete the following information / Пожалуйста, заполните следующую информацию
      value: |
        **App / Приложение:**
        - FlowZapret version (see menu → Components or About): [e.g. 1.2.0]
        - Installed components (Components screen): [e.g. byedpi 0.16.6+…, tgws 1.0.0+…]

        **Device / Устройство:**
        - Device: [e.g. POCO M7 Pro 5G]
        - Android version: [e.g. 15]
        - ABI: [arm64-v8a / armeabi-v7a]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Логи
      description: For the Telegram tab, attach logs from the “Logs” screen (menu → Logs). / Для вкладки Telegram приложите логи с экрана «Логи».
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Before you submit / Прежде чем отправить
      options:
        - label: I have searched the open and closed issues for duplicates / Я искал(а) открытые и закрытые задачи на предмет дубликатов
          required: true
        - label: This is not a question or general feedback / Это не вопрос и не общий отзыв
          required: true
